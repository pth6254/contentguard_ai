services:
  db:
    image: postgres:17
    container_name: contentguard-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: contentguard_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d contentguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4
    container_name: contentguard-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:5051:80"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: contentguard-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/contentguard_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/contentguard_db
    command: ["python", "webhook_worker.py"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  analysis-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/contentguard_db
    command: ["python", "analysis_worker.py"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: contentguard-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  demo-receiver:
    profiles: ["demo"]
    build:
      context: ./demo-receiver
    container_name: contentguard-demo-receiver
    environment:
      CONTENTGUARD_URL: http://backend:8000
      DEMO_CLIENT_API_KEY: ${DEMO_CLIENT_API_KEY:-}
      DEMO_WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:-}
    ports:
      - "9000:9000"
    volumes:
      - demo_db:/data
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  demo_db:
