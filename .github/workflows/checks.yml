name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: contentguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d contentguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://test:test-only-password@localhost:5432/contentguard_test
      JWT_SECRET_KEY: ci-only-signing-key-never-use-in-production
      OPERATOR_EMAIL: ""
      OPERATOR_PASSWORD: ""
      LLM_PROVIDER_EXTRACT: ollama
      LLM_PROVIDER_EXPLAIN: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --tb=short
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
